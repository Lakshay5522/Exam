# Deploy to Render (https://render.com) — free 24/7 plan:
#   1. Push this folder to a GitHub repo
#   2. render.com dashboard: New + > Blueprint > pick the repo
#      (this file is picked up automatically)
#   3. Fill in the secrets when prompted (your key, gateway...)
# The URL becomes https://formfill-xxxx.onrender.com
services:
  - type: web
    name: formfill
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEYS
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: AI_PROVIDER
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: COMPAT_ENDPOINTS
        sync: false
      - key: PROFILES_JSON
        sync: false
      - key: WEB_SEARCH
        value: "1"
      - key: PYTHON_VERSION
        value: 3.12.0
